name: Build and deploy Bottom Fishing PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_run_id:
        description: "Exact already-deployed Unified run ID"
        required: true
        type: string
        default: "2026-08-25-reuse-1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify the exact active Unified run before building
        env:
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
        shell: bash
        run: |
          actual=$(curl --fail --silent --show-error https://garrincha077.github.io/StockScout-Unified/data/manifest.json | python -c "import json,sys; print(json.load(sys.stdin)['runId'])")
          if [ -n "$EXPECTED_RUN_ID" ] && [ "$actual" != "$EXPECTED_RUN_ID" ]; then
            echo "Unified active run $actual does not match requested Bottom PWA run $EXPECTED_RUN_ID" >&2
            exit 1
          fi
          echo "Verified Unified run: $actual" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Prove frontend-only contract
        env:
          VITE_EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
        run: |
          test ! -d backend
          test ! -d api
          test ! -f Dockerfile
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact frontend artifact
        id: deployment
        uses: actions/deploy-pages@f431a20c5ef64e85cc2a22d5189c67cf90a1c707 # v4
      - name: Smoke test Pages shell
        shell: bash
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 https://garrincha077.github.io/StockScout-Bottom-Fishing/ | grep -F "StockScout Bottom Fishing"
