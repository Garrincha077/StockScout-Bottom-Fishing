name: Build and deploy Bottom Fishing PWA
on:
  push:
    branches: [main]
  # Keep the standalone PWA aligned with the latest verified Unified
  # activation without starting a scan. The build is frontend-only and
  # reads the immutable run that Unified has already published.
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      expected_run_id:
        description: "Optional exact already-deployed Unified run ID"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.unified.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify the exact active Unified run before building
        id: unified
        env:
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
        shell: bash
        run: |
          actual=$(curl --fail --silent --show-error https://garrincha077.github.io/StockScout-Unified/data/manifest.json | python -c "import json,sys; print(json.load(sys.stdin)['runId'])")
          if [ -n "$EXPECTED_RUN_ID" ] && [ "$actual" != "$EXPECTED_RUN_ID" ]; then
            echo "Unified active run $actual does not match requested Bottom PWA run $EXPECTED_RUN_ID" >&2
            exit 1
          fi
          echo "run_id=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified Unified run: $actual" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Prove frontend-only contract
        env:
          VITE_EXPECTED_RUN_ID: ${{ steps.unified.outputs.run_id }}
        run: |
          test ! -d backend
          test ! -d api
          test ! -f Dockerfile
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact frontend artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Smoke test Pages shell
        env:
          EXPECTED_RUN_ID: ${{ needs.build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://garrincha077.github.io/StockScout-Bottom-Fishing/
          html_file="$(mktemp)"
          asset_file="$(mktemp)"
          trap 'rm -f "$html_file" "$asset_file"' EXIT
          # A successful Pages deployment can briefly serve the previous CDN asset.
          # Probe exact remote bytes with bounded retries; never relax run-id equality.
          for attempt in $(seq 1 25); do
            if curl -fsSL --max-time 20 "$base" -o "$html_file" \
                && grep -Fq "StockScout Bottom Fishing" "$html_file"; then
              asset="$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' "$html_file" | head -n 1)"
              if [ -n "$asset" ]; then
                case "$asset" in
                  http*) asset_url="$asset" ;;
                  /*) asset_url="https://garrincha077.github.io$asset" ;;
                  *) asset_url="$base${asset#./}" ;;
                esac
                if curl -fsSL --max-time 20 "$asset_url" -o "$asset_file" \
                    && grep -Fq "$EXPECTED_RUN_ID" "$asset_file"; then
                  echo "Smoke-tested Bottom PWA run: $EXPECTED_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            fi
            if [ "$attempt" -eq 25 ]; then
              echo "::error::Pages shell or JS did not expose Unified run $EXPECTED_RUN_ID after 25 checks" >&2
              exit 1
            fi
            sleep 5
          done
